name: Native packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python scripts/release.py artifacts --native
      - uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  arch-metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --sdist
      - name: Render exact-version PKGBUILD
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/render-pkgbuild.py "dist/plasma_dynamic_wallpaper-${version}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: arch-pkgbuild
          path: dist/PKGBUILD
          if-no-files-found: error
