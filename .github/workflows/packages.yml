name: Native packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build native packages
        run: python scripts/release.py artifacts --native

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  arch-metadata:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Render exact-version PKGBUILD
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            python -c '
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          print(project["project"]["version"])
          '
          )"

          python scripts/render-pkgbuild.py \
            "dist/plasma_dynamic_wallpaper-${version}.tar.gz"

      - name: Upload Arch PKGBUILD
        uses: actions/upload-artifact@v7
        with:
          name: arch-pkgbuild
          path: dist/PKGBUILD
          if-no-files-found: error